# Netlify Configuration for Mira Voice AI (React + Vite + Express Serverless)

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"
  functions = "../backend/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  included_files = ["backend/src/**"]

# API Rewrite: Forward all /api/* calls to Express Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA Fallback: Direct all page requests to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
